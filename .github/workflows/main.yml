name: Compiler l'APK Android
on:
  workflow_dispatch:
  push:
    paths: ['**/android/**', '**/server.py', '**/static/**', '.github/workflows/apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Localiser le projet Android (où qu'il soit dans le dépôt)
        id: loc
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "::error::Dossier android introuvable dans le dépôt (settings.gradle.kts absent). Contenu du dépôt :"
            find . -maxdepth 3 -not -path './.git/*' | sort | head -60
            exit 1
          fi
          d=$(dirname "$f"); p=$(dirname "$d")
          echo "Projet Android : $d | racine ERP : $p"
          if [ ! -f "$p/server.py" ] || [ ! -d "$p/static" ]; then
            echo "::error::server.py et/ou le dossier static/ manquent à côté du dossier android ($p). Il faut déposer TOUT le contenu du zip, pas seulement android/."
            find "$p" -maxdepth 2 -not -path './.git/*' | sort | head -60
            exit 1
          fi
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5          # Python de compilation pour Chaquopy (même version que celle embarquée)
        with: { python-version: '3.12' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }

      - name: Compiler l'APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ERP_Atelier_apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
